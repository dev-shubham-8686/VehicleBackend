name: cvp

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: cvp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - cvp-kafka-data:/var/lib/kafka/data

  akhq:
    image: tchiotludo/akhq:0.28.0
    container_name: akhq
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            cvp:
              properties:
                bootstrap.servers: "kafka:19092"
    ports:
      - "8080:8080"
    depends_on:
      - kafka

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: cvp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cvp
      POSTGRES_PASSWORD: cvp_dev_only
      POSTGRES_DB: cvp
    volumes:
      - cvp-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cvp-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cvp.example.com
      PGADMIN_DEFAULT_PASSWORD: cvp_dev_only
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json
      - cvp-pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: cvp-redis
    ports:
      - "6379:6379"
    volumes:
      - cvp-redis-data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: cvp-redisinsight
    environment:
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: "CVP Redis"
    ports:
      - "5540:5540"
    volumes:
      - cvp-redisinsight-data:/data
    depends_on:
      - redis

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    container_name: cvp-jaeger
    ports:
      - "16686:16686" # UI
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: cvp-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC (services send here)
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus-scrapeable metrics
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: cvp-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - cvp-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.4.0
    container_name: cvp-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana-provisioning:/etc/grafana/provisioning
      - cvp-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  vernemq:
    image: vernemq/vernemq:latest
    container_name: cvp-vernemq
    ports:
      - "1883:1883"
      - "8888:8888" # status/health API
    environment:
      DOCKER_VERNEMQ_ACCEPT_EULA: "yes"
      DOCKER_VERNEMQ_ALLOW_ANONYMOUS: "off"
      DOCKER_VERNEMQ_LOG__CONSOLE__LEVEL: warning
      # vmq_webhooks calls out to IdentityService on every connect/publish/subscribe
      # so authn+authz policy lives in C#, not Lua/SQL inside the broker (see
      # docs/ARCHITECTURE.md). Plaintext MQTT still means credentials travel
      # unencrypted on this network — TLS is a Phase 7 hardening item, not done here.
      DOCKER_VERNEMQ_PLUGINS__VMQ_WEBHOOKS: "on"
      # Registered for both the MQTT 3.1.1 hook names and their MQTT5 "_m5"
      # counterparts — MQTTnet 5.x clients negotiate MQTT5 by default, so
      # VerneMQ invokes the _m5 variants for them; the request/response JSON
      # shapes are compatible enough that the same endpoints handle both.
      DOCKER_VERNEMQ_VMQ_WEBHOOKS__AUTH_ON_REGISTER__HOOK: auth_on_register
      DOCKER_VERNEMQ_VMQ_WEBHOOKS__AUTH_ON_REGISTER__ENDPOINT: http://identity-service:8080/webhooks/vernemq/auth-on-register
      DOCKER_VERNEMQ_VMQ_WEBHOOKS__AUTH_ON_REGISTER_M5__HOOK: auth_on_register_m5
      DOCKER_VERNEMQ_VMQ_WEBHOOKS__AUTH_ON_REGISTER_M5__ENDPOINT: http://identity-service:8080/webhooks/vernemq/auth-on-register
      DOCKER_VERNEMQ_VMQ_WEBHOOKS__AUTH_ON_PUBLISH__HOOK: auth_on_publish
      DOCKER_VERNEMQ_VMQ_WEBHOOKS__AUTH_ON_PUBLISH__ENDPOINT: http://identity-service:8080/webhooks/vernemq/auth-on-publish
      DOCKER_VERNEMQ_VMQ_WEBHOOKS__AUTH_ON_PUBLISH_M5__HOOK: auth_on_publish_m5
      DOCKER_VERNEMQ_VMQ_WEBHOOKS__AUTH_ON_PUBLISH_M5__ENDPOINT: http://identity-service:8080/webhooks/vernemq/auth-on-publish
      DOCKER_VERNEMQ_VMQ_WEBHOOKS__AUTH_ON_SUBSCRIBE__HOOK: auth_on_subscribe
      DOCKER_VERNEMQ_VMQ_WEBHOOKS__AUTH_ON_SUBSCRIBE__ENDPOINT: http://identity-service:8080/webhooks/vernemq/auth-on-subscribe
      DOCKER_VERNEMQ_VMQ_WEBHOOKS__AUTH_ON_SUBSCRIBE_M5__HOOK: auth_on_subscribe_m5
      DOCKER_VERNEMQ_VMQ_WEBHOOKS__AUTH_ON_SUBSCRIBE_M5__ENDPOINT: http://identity-service:8080/webhooks/vernemq/auth-on-subscribe
    volumes:
      - cvp-vernemq-data:/vernemq/data
    depends_on:
      - identity-service

  device-gateway:
    build:
      context: ..
      dockerfile: src/Services/DeviceGateway/Dockerfile
    container_name: cvp-device-gateway
    ports:
      - "8081:8080"
    environment:
      Kafka__BootstrapServers: kafka:19092
      Mqtt__BrokerHost: vernemq
      Mqtt__BrokerPort: 1883
      Mqtt__Username: device-gateway
      Mqtt__SharedSecret: dev-gateway-shared-secret-change-me
      Otel__Endpoint: http://otel-collector:4317
    depends_on:
      - kafka
      - vernemq
      - otel-collector

  vehicle-shadow:
    build:
      context: ..
      dockerfile: src/Services/VehicleShadow/Dockerfile
    container_name: cvp-vehicle-shadow
    ports:
      - "8082:8080"
    environment:
      Kafka__BootstrapServers: kafka:19092
      ConnectionStrings__Redis: redis:6379
      Otel__Endpoint: http://otel-collector:4317
    depends_on:
      - kafka
      - redis
      - otel-collector

  command-service:
    build:
      context: ..
      dockerfile: src/Services/CommandService/Dockerfile
    container_name: cvp-command-service
    ports:
      - "8083:8080"
    environment:
      Kafka__BootstrapServers: kafka:19092
      ConnectionStrings__Postgres: Host=postgres;Database=cvp;Username=cvp;Password=cvp_dev_only
      Otel__Endpoint: http://otel-collector:4317
    depends_on:
      - kafka
      - postgres
      - otel-collector

  alerting-service:
    build:
      context: ..
      dockerfile: src/Services/AlertingService/Dockerfile
    container_name: cvp-alerting-service
    ports:
      - "8084:8080"
    environment:
      Kafka__BootstrapServers: kafka:19092
      Otel__Endpoint: http://otel-collector:4317
    depends_on:
      - kafka
      - otel-collector

  ota-service:
    build:
      context: ..
      dockerfile: src/Services/OtaService/Dockerfile
    container_name: cvp-ota-service
    ports:
      - "8085:8080"
    environment:
      Kafka__BootstrapServers: kafka:19092
      ConnectionStrings__Postgres: Host=postgres;Database=cvp;Username=cvp;Password=cvp_dev_only
      Otel__Endpoint: http://otel-collector:4317
    depends_on:
      - kafka
      - postgres
      - otel-collector

  fleet-api:
    build:
      context: ..
      dockerfile: src/Services/FleetApi/Dockerfile
    container_name: cvp-fleet-api
    ports:
      - "8086:8080"
    environment:
      Otel__Endpoint: http://otel-collector:4317
    depends_on:
      - vehicle-shadow
      - command-service
      - alerting-service
      - otel-collector

  identity-service:
    build:
      context: ..
      dockerfile: src/Services/IdentityService/Dockerfile
    container_name: cvp-identity-service
    ports:
      - "8087:8080"
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=cvp;Username=cvp;Password=cvp_dev_only
      Gateway__Username: device-gateway
      Gateway__SharedSecret: dev-gateway-shared-secret-change-me
      Otel__Endpoint: http://otel-collector:4317
    depends_on:
      - postgres
      - otel-collector

  telemetry-processor:
    build:
      context: ..
      dockerfile: src/Services/TelemetryProcessor/Dockerfile
    container_name: cvp-telemetry-processor
    environment:
      Kafka__BootstrapServers: kafka:19092
      ConnectionStrings__Postgres: Host=postgres;Database=cvp;Username=cvp;Password=cvp_dev_only
      Otel__Endpoint: http://otel-collector:4317
    depends_on:
      - kafka
      - postgres
      - otel-collector

  vehicle-simulator:
    build:
      context: ..
      dockerfile: src/Services/VehicleSimulator/Dockerfile
    container_name: cvp-vehicle-simulator
    environment:
      Simulator__BrokerHost: vernemq
      Simulator__BrokerPort: 1883
      Simulator__PublishIntervalSeconds: "30"
      Simulator__IdentityServiceBaseUrl: http://identity-service:8080
      Otel__Endpoint: http://otel-collector:4317
    depends_on:
      - vernemq
      - identity-service
      - otel-collector

volumes:
  cvp-kafka-data:
  cvp-postgres-data:
  cvp-pgadmin-data:
  cvp-redis-data:
  cvp-redisinsight-data:
  cvp-vernemq-data:
  cvp-prometheus-data:
  cvp-grafana-data:
