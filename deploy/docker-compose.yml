name: cvp

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: cvp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - cvp-kafka-data:/var/lib/kafka/data

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: cvp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cvp
      POSTGRES_PASSWORD: cvp_dev_only
      POSTGRES_DB: cvp
    volumes:
      - cvp-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: cvp-redis
    ports:
      - "6379:6379"
    volumes:
      - cvp-redis-data:/data

  vernemq:
    image: vernemq/vernemq:latest
    container_name: cvp-vernemq
    ports:
      - "1883:1883"
      - "8888:8888" # status/health API
    environment:
      DOCKER_VERNEMQ_ACCEPT_EULA: "yes"
      # Dev-only: no auth plugin configured yet. Phase 5 replaces this with a
      # VerneMQ auth plugin (e.g. vmq_diversity) backed by IdentityService.
      DOCKER_VERNEMQ_ALLOW_ANONYMOUS: "on"
      DOCKER_VERNEMQ_LOG__CONSOLE__LEVEL: warning
    volumes:
      - cvp-vernemq-data:/vernemq/data

  device-gateway:
    build:
      context: ..
      dockerfile: src/Services/DeviceGateway/Dockerfile
    container_name: cvp-device-gateway
    ports:
      - "8081:8080"
    environment:
      Kafka__BootstrapServers: kafka:19092
      Mqtt__BrokerHost: vernemq
      Mqtt__BrokerPort: 1883
    depends_on:
      - kafka
      - vernemq

  vehicle-shadow:
    build:
      context: ..
      dockerfile: src/Services/VehicleShadow/Dockerfile
    container_name: cvp-vehicle-shadow
    ports:
      - "8082:8080"
    environment:
      Kafka__BootstrapServers: kafka:19092
      ConnectionStrings__Redis: redis:6379
    depends_on:
      - kafka
      - redis

  command-service:
    build:
      context: ..
      dockerfile: src/Services/CommandService/Dockerfile
    container_name: cvp-command-service
    ports:
      - "8083:8080"
    environment:
      Kafka__BootstrapServers: kafka:19092
      ConnectionStrings__Postgres: Host=postgres;Database=cvp;Username=cvp;Password=cvp_dev_only
    depends_on:
      - kafka
      - postgres

  alerting-service:
    build:
      context: ..
      dockerfile: src/Services/AlertingService/Dockerfile
    container_name: cvp-alerting-service
    ports:
      - "8084:8080"
    environment:
      Kafka__BootstrapServers: kafka:19092
    depends_on:
      - kafka

  ota-service:
    build:
      context: ..
      dockerfile: src/Services/OtaService/Dockerfile
    container_name: cvp-ota-service
    ports:
      - "8085:8080"
    environment:
      Kafka__BootstrapServers: kafka:19092
      ConnectionStrings__Postgres: Host=postgres;Database=cvp;Username=cvp;Password=cvp_dev_only
    depends_on:
      - kafka
      - postgres

  fleet-api:
    build:
      context: ..
      dockerfile: src/Services/FleetApi/Dockerfile
    container_name: cvp-fleet-api
    ports:
      - "8086:8080"
    depends_on:
      - vehicle-shadow
      - command-service
      - alerting-service

  identity-service:
    build:
      context: ..
      dockerfile: src/Services/IdentityService/Dockerfile
    container_name: cvp-identity-service
    ports:
      - "8087:8080"
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=cvp;Username=cvp;Password=cvp_dev_only
    depends_on:
      - postgres

  telemetry-processor:
    build:
      context: ..
      dockerfile: src/Services/TelemetryProcessor/Dockerfile
    container_name: cvp-telemetry-processor
    environment:
      Kafka__BootstrapServers: kafka:19092
      ConnectionStrings__Postgres: Host=postgres;Database=cvp;Username=cvp;Password=cvp_dev_only
    depends_on:
      - kafka
      - postgres

  vehicle-simulator:
    build:
      context: ..
      dockerfile: src/Services/VehicleSimulator/Dockerfile
    container_name: cvp-vehicle-simulator
    environment:
      Simulator__BrokerHost: vernemq
      Simulator__BrokerPort: 1883
    depends_on:
      - vernemq

volumes:
  cvp-kafka-data:
  cvp-postgres-data:
  cvp-redis-data:
  cvp-vernemq-data:
